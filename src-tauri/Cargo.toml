[package]
name = "schedule-app"
version = "1.1.0"
description = "日程系统桌面客户端"
authors = ["WHJ-2007"]
edition = "2021"

[lib]
name = "schedule_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
